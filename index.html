<style>
:root{--bg:#f5f6f8;--surface:#fff;--ink:#12151c;--mute:#5b6270;--rule:#dde0e6;--red:#d7263d;--on-red:#fff;--soft:#eceef2;
--head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Source Serif 4',Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1116;--surface:#161921;--ink:#eceef2;--mute:#9aa1ae;--rule:#2a2f3a;--red:#ff5a6e;--on-red:#12151c;--soft:#1f232d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1116;--surface:#161921;--ink:#eceef2;--mute:#9aa1ae;--rule:#2a2f3a;--red:#ff5a6e;--on-red:#12151c;--soft:#1f232d;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
img{max-width:100%}
.mast{background:var(--surface);padding:28px 5% 18px;text-align:left}
.mast-in,.wrap,.nav-in,.foot-in{max-width:1180px;margin:auto}
.logo{font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,64px);line-height:.95;letter-spacing:-.03em;margin:0}
.logo span{display:inline-block;background:var(--red);color:var(--on-red);padding:0 .22em .06em;margin-left:.12em;transform:rotate(-2deg)}
.tagline{margin:10px 0 0;color:var(--mute);font-size:15px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--rule)}
.nav-in{display:flex;gap:4px;overflow-x:auto;padding:0 5%;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav-in button{background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;font-family:var(--head);font-weight:600;font-size:15px;white-space:nowrap;color:var(--mute)}
.nav-in button:hover{color:var(--ink)}
.nav-in button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--red)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;padding:32px 5% 24px}
.sec-title{font-family:var(--head);font-size:15px;font-weight:700;margin:0 0 16px;color:var(--mute)}
.lead{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;padding-bottom:32px;margin-bottom:32px;border-bottom:1px solid var(--rule)}
.cov{display:block;aspect-ratio:16/10;background:var(--soft);overflow:hidden}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:56px;color:var(--rule)}
.tag{font-family:var(--head);font-weight:700;font-size:13px;color:var(--red)}
.card h3{font-family:var(--head);font-weight:700;font-size:20px;line-height:1.2;margin:6px 0 8px;letter-spacing:-.01em}
.lead h3{font-size:clamp(26px,3.6vw,42px);line-height:1.1;letter-spacing:-.02em;font-weight:800}
.card h3 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.ex{margin:0 0 10px;color:var(--mute);font-size:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{margin:0;font-family:var(--head);font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:36px 28px}
.card .cov{margin-bottom:12px}
.pop{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);align-self:start;border-top:3px solid var(--ink);padding-top:14px}
.pop ol{list-style:none;margin:0;padding:0;counter-reset:n}
.pop li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:6px;padding:14px 0;border-bottom:1px solid var(--rule)}
.pop li::before{content:counter(n);font-family:var(--head);font-weight:800;font-size:28px;line-height:1;color:var(--red)}
.pop a{font-family:var(--head);font-weight:600;line-height:1.3}
.pop a:hover{text-decoration:underline}
.empty{padding:48px 0;color:var(--mute);font-family:var(--head)}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button,.btn{font-family:var(--head);font-weight:600;font-size:13px;border:1px solid var(--rule);background:var(--surface);padding:6px 12px;border-radius:6px}
.acts button:hover,.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.reader{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 5% calc(env(safe-area-inset-bottom,0px) + 48px)}
.reader[hidden]{display:none}
.art{max-width:720px;margin:0 auto}
.back{margin:8px 0 28px}
.art h1{font-family:var(--head);font-weight:800;font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.02em;margin:8px 0 14px}
.art .cov{aspect-ratio:16/9;margin:22px 0 28px}
.body{font-size:19px;line-height:1.75;max-width:66ch}
.body img{display:block;margin:24px 0;height:auto}
.crew{margin-top:36px;padding-top:16px;border-top:1px solid var(--rule);font-family:var(--head);font-size:14px;color:var(--mute)}
footer{border-top:1px solid var(--rule);background:var(--surface);padding:28px 5%;margin-top:24px;font-family:var(--head);font-size:14px;color:var(--mute)}
/* Redaksi (hanya dibuat oleh script untuk pemilik) */
.fabs{position:fixed;right:max(16px,3vw);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:8px}.fabs .btn{box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:999px;padding:10px 16px}.warn{color:var(--red);font-size:14px;margin:8px 0 0}
dialog{width:min(640px,94vw);max-height:92vh;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{font-family:var(--head);margin:0 0 14px;font-size:22px}
dialog label{display:block;font-family:var(--head);font-weight:600;font-size:13px;margin:12px 0 4px}
dialog input[type=text],dialog input[type=password],dialog select{width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tb{display:flex;gap:6px;margin-bottom:6px}
#ed{min-height:200px;max-height:40vh;overflow:auto;padding:10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);font-size:16px;outline:none}
#ed img{max-width:100%;height:auto;display:block;margin:10px 0}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-family:var(--head);font-size:14px;z-index:100}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:32px}.pop{position:static}.lead{grid-template-columns:1fr}.r3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.logo{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.rr{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}
.rr[hidden]{display:none}
.rr-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 10px) 5% 10px;background:var(--surface);border-bottom:1px solid var(--rule);font-family:var(--head)}
.rr-top strong{font-size:18px}.rr-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.rr-body{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
.rr-list{overflow:auto;padding:16px;border-right:1px solid var(--rule);background:var(--surface)}
.rr-edit{overflow:auto;padding:20px 5% calc(env(safe-area-inset-bottom,0px) + 40px)}
.rr-edit form{max-width:720px}
.rit{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--rule);padding:10px 0}
.rtt{flex:1;text-align:left;background:none;border:0;font-family:var(--head);font-weight:600;font-size:14px;line-height:1.3;padding:0}
.rtt small{display:block;color:var(--mute);font-weight:500;margin-top:2px}
.lg{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.lgc{width:min(400px,100%);background:var(--surface);padding:26px;border-radius:12px;border:1px solid var(--rule)}
.lgl{font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:-.02em;margin-bottom:14px}
.lgl span{background:var(--red);color:var(--on-red);padding:0 .2em;margin-left:.1em}
.lgc h2,.rr-edit h2{font-family:var(--head);margin:0 0 6px;font-size:20px}
.lgc label,.rr-edit label{display:block;font-family:var(--head);font-weight:600;font-size:13px;margin:14px 0 4px}
.lgc input[type=password],.lgc input[type=text],.rr-edit input[type=text],.rr-edit select{width:100%;padding:10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.chk{display:flex!important;gap:8px;align-items:center;font-weight:500!important}
.pill{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:50;border-radius:999px;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (max-width:860px){.rr-body{grid-template-columns:1fr}.rr:not(.editing) .rr-edit{display:none}.rr.editing .rr-list{display:none}}
.mast{background:#0a0a0c;color:#f4f4f6;border-bottom:3px solid var(--red);padding:20px 5%}
.mast-in{display:flex;align-items:center;gap:clamp(14px,3vw,28px)}
.mark{width:clamp(72px,12vw,118px);height:clamp(72px,12vw,118px);border-radius:50%;flex:none;display:block;box-shadow:0 8px 30px rgba(215,38,61,.28)}
.logo{color:#f4f4f6;font-size:clamp(26px,5.2vw,54px)}.tagline{color:#a9aab3}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}.wi{display:inline-block;will-change:transform}
.card h3 a:hover{text-decoration:none}.card h3 a:hover .wi{color:var(--red)}.wi{transition:color .2s}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}.lenis.lenis-stopped{overflow:hidden}
.lgc input[type=email]{width:100%;padding:10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Terkini','Nasional','Politik','Hukum','Ekonomi','Olahraga','Gaya Hidup'];
let S=JSON.parse($('#data').textContent),cat='Terkini',admin=false,ST='load';
try{const c=JSON.parse(localStorage.getItem('bbm-cache')||'null');if(Array.isArray(c)&&c.length){S=c;ST='ok'}}catch(e){}
const fmt=t=>new Date(t).toLocaleString('id-ID',{timeZone:'Asia/Makassar',weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})+' WITA';
function clean(h){const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,form').forEach(e=>e.remove());
t.content.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(!['src','alt','href'].includes(a.name)||/^\s*javascript:/i.test(a.value))e.removeAttribute(a.name)}));return t.innerHTML}
const plain=h=>{const t=document.createElement('template');t.innerHTML=h;return t.content.textContent.trim()};
const cover=a=>a.img?`<img src="${esc(a.img)}" alt="" loading="lazy">`:`<div class="ph">${esc(a.kat[0])}</div>`;
const crew=a=>`Penulis: ${esc(a.penulis||'-')} · Reporter: ${esc(a.reporter)} · Editor: ${esc(a.editor)}`;

function card(a,lead){
  return `<article class="card ${lead?'lead':''}"><a class="cov" href="#${a.id}" aria-label="${esc(a.judul)}">${cover(a)}</a><div>
  <span class="tag">${esc(a.kat)}</span><h3><a href="#${a.id}">${esc(a.judul)}</a></h3>
  <p class="ex">${esc(plain(a.isi).slice(0,lead?260:160))}</p><p class="meta">${fmt(a.t)}</p>
  ${admin?`<div class="acts admin-only"><button data-edit="${a.id}">Edit</button><button data-del="${a.id}">Hapus</button></div>`:''}</div></article>`}

function render(){
  $('#nav').innerHTML=CATS.map(c=>`<button data-c="${c}" aria-pressed="${c===cat}">${c}</button>`).join('');
  $('#sect').textContent=cat==='Terkini'?'Berita terkini':cat;
  const L=S.filter(a=>cat==='Terkini'||a.kat===cat).sort((a,b)=>b.t-a.t);
  $('#feed').innerHTML=ST==='load'?'<p class="empty">Memuat berita…</p>':ST==='err'?'<p class="empty">Berita belum bisa dimuat. Periksa koneksi internet, lalu muat ulang halaman.</p>':L.length?card(L[0],true)+`<div class="grid">${L.slice(1).map(a=>card(a)).join('')}</div>`:`<p class="empty">Belum ada berita di kategori ini.</p>`;
  const P=S.filter(a=>a.pop).sort((a,b)=>b.t-a.t);
  $('#pop').innerHTML=P.length?P.map(a=>`<li><a href="#${a.id}">${esc(a.judul)}</a></li>`).join(''):`<li class="empty" style="display:block;padding:12px 0">Belum ada berita terpopuler.</li>`;
  fx();
}
function route(){
  const a=S.find(x=>x.id===location.hash.slice(1)),r=$('#reader');
  r.hidden=!a;document.body.style.overflow=a?'hidden':'';
  if(!a){r.replaceChildren();return}
  r.innerHTML=`<div class="art"><button class="btn back" id="back">← Kembali</button><span class="tag">${esc(a.kat)}</span><h1>${esc(a.judul)}</h1>
  <p class="meta">${fmt(a.t)}</p>${a.img?`<div class="cov"><img src="${esc(a.img)}" alt=""></div>`:''}
  <div class="body">${clean(a.isi)}</div><div class="crew">${crew(a)}</div></div>`;
  r.scrollTop=0;fxReader();
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;location.hash='';render();return}
  if(e.target.closest('#back')){location.hash='';return}
});
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(e.key==='Escape'&&location.hash.length>1)location.hash=''});
/* ===== Animasi: GSAP + ScrollTrigger (judul per kata), Motion (kartu), Lenis (scroll halus) ===== */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;let FXON=false,FX=[],lenis=null;
function words(el){
  if(!el.querySelector('.wi')){const t=el.textContent.trim();el.setAttribute('aria-label',t);
    el.innerHTML=t.split(/\s+/).map(w=>`<span class="w" aria-hidden="true"><span class="wi">${esc(w)}</span></span>`).join(' ')}
  return el.querySelectorAll('.wi')}
function fx(){
  if(!FXON)return;
  FX.forEach(t=>{try{t.scrollTrigger&&t.scrollTrigger.kill();t.kill()}catch(e){}});FX=[];
  document.querySelectorAll('#feed .card h3 a,#sect').forEach(el=>{
    FX.push(gsap.from(words(el),{yPercent:115,duration:.9,ease:'power4.out',stagger:.07,scrollTrigger:{trigger:el,start:'top 92%',once:true}}))});
  const M=window.Motion;
  if(M&&M.animate&&M.inView){
    document.querySelectorAll('#feed .card').forEach((c,i)=>{
      c.style.opacity=0;c.style.transform='translateY(40px)';
      M.inView(c,()=>{M.animate(c,{opacity:1,transform:'translateY(0px)'},{duration:.8,delay:(i%3)*.08,ease:[.22,1,.36,1]})},{margin:'0px 0px -8% 0px'});
      const im=c.querySelector('.cov img,.cov .ph');
      c.addEventListener('mouseenter',()=>{M.animate(c,{transform:'translateY(-6px)'},{duration:.35});im&&M.animate(im,{transform:'scale(1.07)'},{duration:.6})});
      c.addEventListener('mouseleave',()=>{M.animate(c,{transform:'translateY(0px)'},{duration:.35});im&&M.animate(im,{transform:'scale(1)'},{duration:.6})})})}
  ScrollTrigger.refresh();
}
function fxReader(){
  if(!FXON)return;const h=$('#reader h1');
  if(h)gsap.from(words(h),{yPercent:115,duration:.9,ease:'power4.out',stagger:.06,delay:.15});
  const M=window.Motion,a=$('#reader .art');
  if(M&&M.animate&&a)M.animate(a,{opacity:[0,1],transform:['translateY(24px)','translateY(0px)']},{duration:.6});
}
function initFx(){
  if(RM||!window.gsap||!window.ScrollTrigger)return;
  gsap.registerPlugin(ScrollTrigger);
  if(window.Lenis){lenis=new Lenis({lerp:.09});lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0)}
  gsap.from('.mark',{scale:.6,opacity:0,rotate:-14,duration:1.1,ease:'back.out(1.7)'});
  gsap.from('.tagline',{y:14,opacity:0,duration:.8,delay:.35,ease:'power3.out'});
  FXON=true;fx();addEventListener('load',()=>ScrollTrigger.refresh());
}
document.addEventListener('DOMContentLoaded',initFx);
render();route();

/* ===== Memuat berita dari Firebase ===== */
async function loadNews(){
  try{S=await FB.list();ST='ok';try{localStorage.setItem('bbm-cache',JSON.stringify(S))}catch(e){}}
  catch(e){console.error('Gagal memuat berita:',e);if(!S.length)ST='err'}
  render();route();if(ON&&$('#rl'))rlist();
}
addEventListener('fb-ready',loadNews);
if(window.FB)loadNews();
setTimeout(()=>{if(ST==='load'){ST='err';render()}},12000);

/* ===== Ruang redaksi: ketuk logo 5x, atau tambahkan #redaksi di alamat web ===== */
let ON=false,taps=0,tt,cur=null,rg=null;
const errMsg=x=>({'auth/invalid-credential':'Email atau password salah.','auth/wrong-password':'Email atau password salah.','auth/user-not-found':'Email atau password salah.','auth/invalid-email':'Format email tidak valid.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.','auth/network-request-failed':'Tidak ada koneksi internet.','auth/operation-not-supported-in-this-environment':'Buka web lewat alamat hosting (https), bukan file lokal.','permission-denied':'Akun ini tidak punya izin menulis. Periksa email admin di aturan Firestore.','unavailable':'Server tidak terjangkau. Coba lagi.'}[x&&x.code]||'Terjadi kesalahan: '+((x&&(x.code||x.message))||x));
function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast admin-only';t.setAttribute('role','status');document.body.append(t)}t.textContent=m;clearTimeout(t._h);t._h=setTimeout(()=>t.remove(),5000)}
document.querySelectorAll('#logo,.mark').forEach(x=>x.addEventListener('click',()=>{if(ON)return;clearTimeout(tt);tt=setTimeout(()=>taps=0,2500);if(++taps>=5){taps=0;login()}}));
function hashLogin(){if(location.hash==='#redaksi'){location.hash='';if(!ON)login()}}
addEventListener('hashchange',hashLogin);

async function login(){
  if(ON||$('#lg'))return;
  if(!window.FB){alert('Layanan belum siap. Tunggu sebentar lalu coba lagi.');return}
  const u=await FB.who();if(u){unlock(u);return}
  const o=document.createElement('div');o.id='lg';o.setAttribute('data-lenis-prevent','');o.className='lg admin-only';
  o.innerHTML=`<form class="lgc" id="lf"><div class="lgl"><img src="${$('.mark').src}" alt="" style="width:46px;height:46px;border-radius:50%;vertical-align:middle;margin-right:10px">Bangku Belakang<span>Media</span></div><h2>Masuk ke ruang redaksi</h2>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
  <label class="chk"><input type="checkbox" id="sh"> Tampilkan password</label>
  <p class="warn" id="le" role="alert"></p>
  <div class="row"><button type="button" class="btn" id="lx">Batal</button><button class="btn pri">Masuk</button></div></form>`;
  document.body.append(o);const pw=$('#pw');$('#em').focus();
  $('#sh').onchange=e=>pw.type=e.target.checked?'text':'password';
  $('#lx').onclick=()=>o.remove();
  o.onkeydown=e=>{if(e.key==='Escape')o.remove()};
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='Memeriksa…';
    try{const c=await FB.login($('#em').value.trim(),pw.value);o.remove();unlock(c.user)}catch(x){$('#le').textContent=errMsg(x);pw.select()}};
}
function unlock(u){
  ON=true;const r=document.createElement('div');r.className='rr admin-only';r.id='rr';r.setAttribute('data-lenis-prevent','');
  r.innerHTML=`<header class="rr-top"><strong>Ruang Redaksi</strong><span class="meta" id="rst">Masuk sebagai ${esc(u.email)}</span><div class="rr-act"><button class="btn" id="vw">Lihat situs</button><button class="btn" id="a2">Muat ulang</button><button class="btn" id="a4">Keluar</button></div></header>
  <div class="rr-body"><aside class="rr-list"><button class="btn pri" id="nw" style="width:100%">+ Berita baru</button><div id="rl"></div></aside><section class="rr-edit" id="re"></section></div>`;
  document.body.append(r);document.body.style.overflow='hidden';
  r.onclick=async e=>{const a=e.target.closest('[data-e]');if(a)return openForm(a.dataset.e);
    const d=e.target.closest('[data-d]');if(!d||!confirm('Hapus berita ini secara permanen?'))return;
    try{await FB.del(d.dataset.d);S=S.filter(x=>x.id!==d.dataset.d);render();rlist();empty();toast('Berita dihapus.')}catch(x){alert(errMsg(x))}};
  $('#nw').onclick=()=>openForm();
  $('#a2').onclick=async()=>{await loadNews();toast('Daftar berita diperbarui.')};
  $('#a4').onclick=()=>{FB.logout().finally(()=>location.reload())};
  $('#vw').onclick=()=>{r.hidden=true;document.body.style.overflow='';const p=document.createElement('button');p.className='btn pri pill admin-only';p.textContent='Buka ruang redaksi';
    p.onclick=()=>{p.remove();r.hidden=false;document.body.style.overflow='hidden'};document.body.append(p)};
  rlist();empty();
}
function rlist(){const L=[...S].sort((a,b)=>b.t-a.t);
  $('#rl').innerHTML=L.length?L.map(a=>`<div class="rit"><button class="rtt" data-e="${a.id}">${esc(a.judul)}<small>${esc(a.kat)} · ${fmt(a.t)}</small></button><button class="btn" data-d="${a.id}">Hapus</button></div>`).join(''):'<p class="meta">Belum ada berita. Klik “+ Berita baru”.</p>'}
function empty(){$('#rr').classList.remove('editing');$('#re').innerHTML='<p class="meta" style="margin-top:30px">Pilih berita di daftar untuk mengedit, atau klik “+ Berita baru”.</p>'}
const pick=(max=900)=>new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};
    im.onerror=()=>{alert('Foto tidak bisa dibaca.');res(null)};im.src=URL.createObjectURL(f)};i.click()});
function openForm(id){
  const a=id?S.find(x=>x.id===id):null;cur={id:a?.id,img:a?.img||'',t:a?.t};
  $('#rr').classList.add('editing');
  $('#re').innerHTML=`<form id="f"><h2>${a?'Edit berita':'Berita baru'}</h2>
  <label for="j">Judul</label><input type="text" id="j" required value="${esc(a?.judul)}">
  <label for="k">Kategori</label><select id="k">${CATS.slice(1).map(c=>`<option ${a?.kat===c?'selected':''}>${c}</option>`).join('')}</select>
  <label>Foto sampul</label><button type="button" class="btn" id="cv">${cur.img?'Ganti foto sampul':'Pilih foto sampul'}</button> <span id="cvn" class="meta">${cur.img?'Foto terpasang':''}</span>
  <label>Isi berita</label><div class="tb"><button type="button" class="btn" data-f="bold"><b>B</b></button><button type="button" class="btn" data-f="italic"><i>I</i></button><button type="button" class="btn" id="ii">Sisipkan foto</button></div>
  <div id="ed" contenteditable="true">${a?clean(a.isi):''}</div>
  <div class="r3"><div><label for="p">Penulis</label><input type="text" id="p" required value="${esc(a?.penulis)}"></div><div><label for="r">Reporter</label><input type="text" id="r" required value="${esc(a?.reporter)}"></div><div><label for="e">Editor</label><input type="text" id="e" required value="${esc(a?.editor)}"></div></div>
  <label class="chk"><input type="checkbox" id="pp" ${a?.pop?'checked':''}> Tampilkan di Terpopuler</label>
  <div class="row"><button type="button" class="btn" id="x">Batal</button><button class="btn pri">Simpan dan terbitkan</button></div></form>`;
  const ed=$('#ed');ed.addEventListener('blur',()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))rg=s.getRangeAt(0)});
  document.querySelectorAll('#re [data-f]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>document.execCommand(b.dataset.f)});
  $('#cv').onclick=async()=>{const u=await pick(900);if(u){cur.img=u;$('#cvn').textContent='Foto terpasang'}};
  $('#ii').onclick=async()=>{const u=await pick(800);if(!u)return;ed.focus();if(rg){const s=getSelection();s.removeAllRanges();s.addRange(rg)}document.execCommand('insertImage',false,u)};
  $('#x').onclick=empty;
  $('#f').onsubmit=async e=>{e.preventDefault();const isi=clean(ed.innerHTML).trim();
    if(!plain(isi)&&!isi.includes('<img')){alert('Isi berita tidak boleh kosong.');return}
    const n={id:cur.id||'b'+Date.now(),judul:$('#j').value.trim(),kat:$('#k').value,isi,penulis:$('#p').value.trim(),reporter:$('#r').value.trim(),editor:$('#e').value.trim(),img:cur.img,pop:$('#pp').checked,t:cur.t||Date.now()};
    if(JSON.stringify(n).length>900000){alert('Berita terlalu besar (batas sekitar 1 MB). Kurangi jumlah atau ukuran foto.');return}
    const b=$('#f button.pri');b.disabled=true;b.textContent='Menyimpan…';
    try{await FB.save(n);S=cur.id?S.map(x=>x.id===n.id?n:x):[n,...S];render();rlist();empty();toast('Berita tersimpan dan sudah tayang.')}
    catch(x){b.disabled=false;b.textContent='Simpan dan terbitkan';alert(errMsg(x))}};
  $('#j').focus();
}
hashLogin();
</script>
<script type="module">

const app=initializeApp({apiKey:"AIzaSyCYGv_MsYsR6zj7WMP6ZJeAyW-QrNvoV5M",authDomain:"bangku-belakang-1053e.firebaseapp.com",projectId:"bangku-belakang-1053e",storageBucket:"bangku-belakang-1053e.firebasestorage.app",messagingSenderId:"234049744110",appId:"1:234049744110:web:937b8cf49ade76aa2dd7ff"});
const db=getFirestore(app);
window.FB={
  list:async()=>(await getDocs(query(collection(db,'berita'),orderBy('t','desc'),limit(40)))).docs.map(d=>({...d.data(),id:d.id})),
